name: Extended PR validation

on:
  pull_request:
    branches:
      - dev
      - test
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

jobs:
  lint-shell:
    name: Shell validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Detect shell scripts
        id: shell_files
        run: |
          mapfile -d '' files < <(find . -type f -name '*.sh' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found."
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bash syntax check
        if: steps.shell_files.outputs.count != '0'
        run: |
          mapfile -d '' files < <(find . -type f -name '*.sh' -print0)
          for f in "${files[@]}"; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck lint
        if: steps.shell_files.outputs.count != '0'
        run: |
          mapfile -d '' files < <(find . -type f -name '*.sh' -print0)
          for f in "${files[@]}"; do
            echo "shellcheck $f"
            shellcheck "$f"
          done

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests placeholder
        run: |
          echo "Unit tests placeholder"
          echo "Add project-specific tests here: state logic, retry policy, parsing, command queue."
          exit 0

  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Smoke validation placeholder
        run: |
          echo "Smoke test placeholder"
          echo "Validate minimal workflow: status check, reconnection flow, auth-required path simulation."
          exit 0

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Integration validation placeholder
        run: |
          echo "Integration tests placeholder"
          echo "Simulate interaction manager + bot + recovery logic using fake adguardvpn-cli and fake network calls."
          exit 0

  final-check:
    name: Final PR gate
    needs:
      - lint-shell
      - unit-tests
      - smoke-tests
      - integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Validate all jobs succeeded
        run: |
          echo "All validation jobs passed. PR can proceed to review and merge workflow."

      - name: Comment on success
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              '✅ Расширенная валидация PR прошла успешно.',
              '',
              'Проверено:',
              '- shell validation',
              '- unit tests placeholder',
              '- smoke tests placeholder',
              '- integration tests placeholder',
              '',
              'Следующим шагом является review-agent / human review и закрытие замечаний.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              '⚠️ Расширенная валидация PR не пройдена.',
              '',
              'Необходимо:',
              '- исправить все failed jobs',
              '- повторно запустить проверку в том же PR',
              '- закрыть обязательные замечания после нового коммита.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
